name: Post-merge self-heal
on:
  workflow_run:
    workflows: ["Test", "VS Code Extension Test"]
    branches: [main]
    types: [completed]
permissions: {}
jobs:
  heal:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: HikaruEgashira/gh-verify/.github/workflows/post-merge-heal.yml@534d0df958815b3f73e8b389bf216b83e5828365
    with:
      automation_ref: 534d0df958815b3f73e8b389bf216b83e5828365
      check_workflows: '["test.yml"]'
      post_merge_workflows: '["test.yml","vscode-test.yml"]'
