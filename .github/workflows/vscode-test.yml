name: VS Code Extension Test

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  vscode-test:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        os: [hikae-flash]
        vscode-version: [stable, insiders]
        include:
          - os: hikae-flash
            runner: [self-hosted, linux, arm64, hikae-flash]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install dependencies
      run: bun install
      
    - name: Run linter
      run: bun run lint
      
    - name: Build extension
      run: bun run compile
      
    - name: Install virtual display
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb xauth

    - name: Run VS Code tests (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a bun run test:vscode
      env:
        VSCODE_VERSION: ${{ matrix.vscode-version }}
        
    - name: Package extension
      run: bun run package
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.vscode-version }}
        path: |
          test-results/
          coverage/