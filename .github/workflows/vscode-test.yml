name: VS Code Extension Test

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  vscode-test:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        os: [hikae-flash]
        vscode-version: [stable, insiders]
        include:
          - os: hikae-flash
            runner: [self-hosted, linux, arm64, hikae-flash]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Setup Bun
      run: |
        curl -fsSL https://bun.sh/install | bash
        echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
        
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20
        
    - name: Install dependencies
      run: bun install
      
    - name: Run linter
      run: bun run lint
      
    - name: Build extension
      run: bun run compile
      
    - name: Install VS Code system dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libgbm1 libasound2-dev

    - name: Run VS Code tests (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a bun run test:vscode
      env:
        VSCODE_VERSION: ${{ matrix.vscode-version }}
        
    - name: Package extension
      run: bun run package
      
    - name: Upload test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.vscode-version }}
        path: |
          test-results/
          coverage/